services:
  postgres:
    image: postgres:16
    container_name: money-autopsy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: money_autopsy
      POSTGRES_USER: money_autopsy
      POSTGRES_PASSWORD: money_autopsy_dev
    ports:
      - "5432:5432"
    volumes:
      - money_autopsy_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U money_autopsy -d money_autopsy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  money_autopsy_pgdata: